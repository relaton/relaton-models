# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
name: make

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:

jobs:
  make:
    name: Test on LutaML ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      # Self-contained tool setup. The former shared workflow
      # (relaton/support make.yml) pinned
      # metanorma/metanorma-build-scripts/plantuml-setup-action@main, which
      # was removed upstream on 2026-08-17, breaking every @main consumer
      # at action-download time — and the unpinned legacy lutaml gem stack
      # no longer resolves to a loadable combination. This repository now
      # renders diagrams with lutaml-lml (graphviz-backed); graphviz is
      # preinstalled on all GitHub-hosted runners, installed defensively
      # only when missing.
      - if: runner.os == 'Linux'
        run: command -v dot >/dev/null || { sudo apt-get update && sudo apt-get install -y graphviz; }
      - if: runner.os == 'macOS'
        run: command -v dot >/dev/null || brew install graphviz
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command dot -ErrorAction SilentlyContinue)) { choco install -y graphviz }

      # workaround for https://github.com/actions/runner-images/issues/37
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - run: bundle exec make clean all

      - name: Verify PNG output (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          count=0
          for p in images/*.png; do
            count=$((count+1))
            if ! file -b "$p" | grep -q "^PNG image data"; then
              echo "ERROR: $p is not a valid PNG ($(file -b "$p"))" >&2
              exit 1
            fi
          done
          echo "verify: $count PNG file(s) OK"
