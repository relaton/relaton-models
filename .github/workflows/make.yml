# Auto-generated by Cimas: Do not edit it manually!
# See https://github.com/metanorma/cimas
name: make

on:
  push:
    branches: [ main, master ]
    tags: [ v* ]
  pull_request:

jobs:
  make:
    name: Test on LutaML ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      # Self-contained plantuml setup. The former shared workflow
      # (relaton/support make.yml) pinned
      # metanorma/metanorma-build-scripts/plantuml-setup-action@main, which
      # was removed upstream on 2026-08-17, breaking every @main consumer
      # at action-download time. Install per-OS directly instead.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml
      - if: runner.os == 'macOS'
        run: brew install plantuml
      - if: runner.os == 'Windows'
        run: choco install -y plantuml

      # workaround for https://github.com/actions/runner-images/issues/37
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - run: bundle exec make clean all
